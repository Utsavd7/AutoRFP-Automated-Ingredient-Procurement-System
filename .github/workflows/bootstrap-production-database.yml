name: Bootstrap QuotePlate production database

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA on main with successful CI
        required: true
        type: string
      confirmation:
        description: Type BOOTSTRAP_QUOTEPLATE_DATABASE_ONLY
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: quoteplate-production-database
  cancel-in-progress: false

jobs:
  bootstrap:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce the database-only gate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          test "$CONFIRMATION" = "BOOTSTRAP_QUOTEPLATE_DATABASE_ONLY"
          printf '%s\n' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Verify the exact commit is on main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/main"

      - name: Verify CI succeeded for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          ci_conclusion=$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" \
            -f branch=main \
            -f status=completed \
            -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | first | .conclusion // ""')
          test "$ci_conclusion" = "success"

      - name: Use the release Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm

      - name: Install exact migration dependencies
        run: npm ci --omit=peer

      - name: Apply migrations only
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          set -eu
          test -n "$DATABASE_URL"
          test -n "$DIRECT_URL"
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Confirm no site was published
        run: printf '%s\n' 'Database migration complete. No hosting deploy was attempted.'
