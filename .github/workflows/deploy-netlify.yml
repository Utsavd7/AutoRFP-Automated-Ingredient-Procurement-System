name: Deploy approved release to Netlify

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA already verified by CI
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_QUOTEPLATE_FREE_ONLY
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: quoteplate-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Enforce the manual release gate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          test "$CONFIRMATION" = "DEPLOY_QUOTEPLATE_FREE_ONLY"
          test -n "$PRODUCTION_URL"
          printf '%s\n' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Verify the exact commit is on main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/main"

      - name: Verify CI succeeded for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -eu
          ci_conclusion=$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" \
            -f branch=main \
            -f status=completed \
            -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | first | .conclusion // ""')
          test "$ci_conclusion" = "success"

      - name: Use Node.js for the pinned Netlify CLI
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm

      - name: Install exact application dependencies
        run: npm ci --omit=peer

      - name: Re-run release checks
        run: |
          set -eu
          npm run lint
          npm run typecheck
          npm test

      - name: Apply production migrations with the migration-only owner credential
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          set -eu
          test -n "$DATABASE_URL"
          test -n "$DIRECT_URL"
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Publish the approved release
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          QUOTEPLATE_APPROVED_RELEASE: "1"
        run: npx --no-install netlify deploy --build --prod --message "approved release ${{ inputs.release_sha }}"

      - name: Run the post-deploy canary
        env:
          CANARY_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: scripts/canary.sh
